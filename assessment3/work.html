    <style>
      /* ---------- The poster: 48 columns x 30 rows over the whole window ---------- */
      /* Every item is placed in the tag with grid-column: START / span WIDTH and
         grid-row: START / span HEIGHT. Items later in the page are drawn on top. */
      .poster {
        position: relative;
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: repeat(48, 1fr);
        grid-template-rows: repeat(30, 1fr);
        background-color: var(--paper);
        /* Graph paper: thin lines on every cell, darker lines every 4th cell. The background
           tiles are the same size as the grid cells, so they line up. */
        background-image: linear-gradient(
            rgba(0, 0, 0, 0.3) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(0, 0, 0, 0.3) 1px, transparent 1px),
          linear-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.12) 1px, transparent 1px);
        background-size: calc(100% / 12) calc(100% / 7.5),
          calc(100% / 12) calc(100% / 7.5), calc(100% / 48) calc(100% / 30),
          calc(100% / 48) calc(100% / 30);
        font-family: var(--font);
        font-weight: 500;
        color: var(--black);
      }

      /* ---------- Shapes ---------- */
      .black {
        background: var(--black);
      }
      .white {
        background: #fbfbfa;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .outline {
        border: 4px solid var(--blue);
      }
      .bar {
        align-self: center;
        height: 10px;
        background: var(--black);
      }
      .dot {
        align-self: center;
        justify-self: center;
        width: 0.5vw;
        height: 0.5vw;
        border-radius: 50%;
        background: #e8222a;
      }

      /* ---------- Text ---------- */
      .poster h1,
      .poster h2,
      .poster p {
        margin: 0;
        text-align: left;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--black);
      }
      .label {
        align-self: center;
        display: flex;
        align-items: center;
        gap: 0.5vw;
        font-size: max(0.9rem, 1.5vw);
      }
      .label::before {
        /* the curly brace on the left */
        content: "{";
        font-size: 3.4vw;
        font-weight: 400;
        line-height: 1;
      }
      .label.right {
        justify-content: space-between;
      }
      .label.right::before {
        content: none;
      }
      .label.right h2 {
        font-size: min(6vh, 6vw);
        line-height: 0.9;
      }
      .label.right::after {
        /* the curly brace on the right */
        content: "}";
        font-size: min(8vh, 7vw);
        font-weight: 400;
        line-height: 1;
        transform: translate(-20vw, 0);
      }
      .label .blue {
        color: var(--blue);
      }
      /* white text centred in a black block */
      .block-text {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 3.8vw;
      }
      .title {
        align-self: center;
        font-size: 6.6vw;
        font-weight: 500;
        line-height: 0.95;
      }
      /* the blue line through "Vuong" */
      .title span {
        text-decoration: line-through;
        text-decoration-color: var(--blue);
        text-decoration-thickness: 0.35vw;
      }
      .year {
        align-self: center;
        font-size: 5vw;
        line-height: 1;
      }
      footer {
        align-self: center;
        text-transform: uppercase;
        line-height: 1.2;
      }
      /* menu colour on hover*/
      nav a:hover {
        color: var(--blue);
      }

      /* ---------- Books ---------- */
      /* A book is the cover with its caption under it. Its height is its content, so the
         blue frame on hover holds both. */
      .book {
        position: relative;
        margin: 0 2px; /* a little air between neighbouring books */
        align-self: start;
      }
      .book img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 2 / 3;
      }
      .book figcaption {
        position: relative;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 2px 4px;
        background: rgba(251, 251, 250, 0.92);
        font-size: max(0.65rem, 0.85vw);
        line-height: 1.05;
        text-transform: uppercase;
      }
      .book:focus-within {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      .book:hover {
        z-index: 5;
        outline: 3px solid var(--blue);
      }

      /* ---------- The portrait in blue and black ---------- */
      .head {
        position: relative;
        isolation: isolate;
        background: var(--blue);
      }
      .head img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 48% 30%;
        mix-blend-mode: multiply; /* light parts turn blue, dark parts stay black */
        filter: grayscale(1) contrast(1.3) brightness(1.15);
      }

      @media (max-width: 700px), (max-aspect-ratio: 1/1), (max-height: 520px) {
        .poster {
          height: auto;
          grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
          grid-template-rows: none;
          gap: 4vw;
          padding: 5vw;
          box-sizing: border-box;

          background-size: 8.333vw 8.333vw, 8.333vw 8.333vw, 2.083vw 2.083vw,
            2.083vw 2.083vw;
        }
        .poster > * {
          grid-column: auto !important;
          grid-row: auto !important;
        }

        .outline,
        .black,
        .white,
        .bar,
        .dot,
        .year {
          display: none;
        }

        /* these run the full width of the page */
        .poster > nav,
        .label,
        .title,
        .head,
        .poster > footer {
          grid-column: 1 / -1 !important;
        }

        /* reading order */
        nav {
          order: -6;
        }
        .label:not(.right) {
          order: -5;
          font-size: 1.4rem;
        }
        .label::before {
          font-size: 2.4rem;
        }
        .head {
          order: -2;
          aspect-ratio: 3 / 2;
        }
        .label.right {
          order: -1; /* after the portrait, before the books */
        }
        .label.right h2 {
          font-size: clamp(2.4rem, 13vw, 4rem);
        }
        .label.right::after {
          font-size: clamp(3rem, 18vw, 5.5rem);
        }
        .title {
          order: 1; /* after the books, right on top of the footer */
          font-size: 20vw;
        }
        .title br {
          display: none;
        }
        .title span {
          text-decoration-thickness: 1vw;
        }
        footer {
          order: 2;
          align-self: start;
        }

        .book figcaption {
          font-size: 0.7rem;
        }
      }
